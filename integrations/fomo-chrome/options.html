<!doctype html><html><head><meta charset="utf-8"><title>FOMO market bridge</title></head>
<body><h1>Connect your local paper scanner</h1>
<p>Paste the local bridge pairing key printed by <code>fomo-setup</code>. This is not your FOMO session token.</p>
<label>Local pairing key <input id="key" type="password" size="68" autocomplete="off"></label>
<button id="save">Save pairing key</button><p id="status"></p>
<p>Keep FOMO open and reload it after installing or restarting Chrome. This extension only requests market metrics; it cannot submit trades through this adapter.</p>
<script src="options.js"></script></body></html>
